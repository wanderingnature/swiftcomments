[project]
name = "swiftcomments"
version = "0.1.0"
description = "Public Comment Analysis Method"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv",
    "requests",
    "numpy",
    "mmh3",
    "bitarray",
    "pyahocorasick",
    "langdetect",
    "spacy",
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
    "tqdm",
    "rich",
    "python-docx",
    "striprtf",
    # The one sentence method, packages/comment-sentences (standard library only)
    "comment-sentences",
    # The clusters and topics of the gate-opening sentences (scripts/topics/): PCA, HDBSCAN,
    # agglomeration, the vectorizer; UMAP.
    "scikit-learn>=1.9.1",
    "umap-learn>=0.5.12",
    "pacmap>=0.9.1",
    # The record documents' chunk windows (scripts/docindex/)
    "langchain-text-splitters",
]

[dependency-groups]
console = [
    "streamlit>=1.65.0",
]
dev = ["pytest", { include-group = "console" }]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/comment-sentences/tests"]

[tool.uv.sources]
comment-sentences = { path = "packages/comment-sentences", editable = true }
