<svg xmlns="http://www.w3.org/2000/svg" width="760" height="673" viewBox="0 0 760 673" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="760" height="673" fill="#ffffff"/>
<text x="16" y="24" font-size="14" font-weight="600" fill="#24292f">The pipeline</text>
<rect x="32" y="40" width="420" height="71" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="44" y="62" font-size="13" font-weight="600" fill="#24292f">1 · The corpus</text>
<text x="44" y="79" font-size="12" fill="#57606a">make corpus</text>
<text x="44" y="96" font-size="12" fill="#24292f">390,064 comments from the bulk download</text>
<rect x="32" y="137" width="420" height="71" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="44" y="159" font-size="13" font-weight="600" fill="#24292f">2 · The copies and the campaigns</text>
<text x="44" y="176" font-size="12" fill="#57606a">make dedup · ngrams · groups</text>
<text x="44" y="193" font-size="12" fill="#24292f">78,953 distinct texts; the campaign split</text>
<rect x="32" y="234" width="420" height="71" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="44" y="256" font-size="13" font-weight="600" fill="#24292f">3 · The mechanical reading</text>
<text x="44" y="273" font-size="12" fill="#57606a">make ner · tag · floor · screen</text>
<text x="44" y="290" font-size="12" fill="#24292f">entities, citations, the floor; classes A, B1, B2</text>
<rect x="32" y="331" width="420" height="88" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="44" y="353" font-size="13" font-weight="600" fill="#24292f">4 · The substance readings</text>
<text x="44" y="370" font-size="12" fill="#57606a">make stance · score-model ·</text>
<text x="44" y="387" font-size="12" fill="#57606a">score-model-free · assemble · rate</text>
<text x="44" y="404" font-size="12" fill="#24292f">the stance; eight dimensions; answerability A0 to A3</text>
<rect x="32" y="445" width="420" height="71" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="44" y="467" font-size="13" font-weight="600" fill="#24292f">5 · The sentences and the concerns</text>
<text x="44" y="484" font-size="12" fill="#57606a">make sentences · embed · clusters</text>
<text x="44" y="501" font-size="12" fill="#24292f">clusters, topics, the concern map</text>
<rect x="32" y="542" width="420" height="71" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="44" y="564" font-size="13" font-weight="600" fill="#24292f">6 · The record search</text>
<text x="44" y="581" font-size="12" fill="#57606a">make docindex · retrieve · nli</text>
<text x="44" y="598" font-size="12" fill="#24292f">addressed, contested, or not_addressed</text>
