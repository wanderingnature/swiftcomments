<text x="504" y="353" font-size="13" font-weight="600" fill="#24292f">The attachments</text>
<text x="504" y="370" font-size="12" fill="#57606a">make fetch · text · attachments · orgs</text>
<text x="504" y="387" font-size="12" fill="#24292f">what each file is; the OCR; who filed;</text>
